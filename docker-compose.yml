services:
  postgres:
    image: postgres:15
    container_name: oauth_postgres
    environment:
      POSTGRES_DB: oauth_db
      POSTGRES_USER: oauth_user
      POSTGRES_PASSWORD: oauth_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oauth_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth_user -d oauth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oauth_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - oauth_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  oauth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oauth_service
    ports:
      - '5000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://oauth_user:oauth_password@postgres:5432/oauth_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh-secret-change-me}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      VERIFICATION_TOKEN_EXPIRY_HOURS: ${VERIFICATION_TOKEN_EXPIRY_HOURS:-24}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oauth_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  oauth_network:
    driver: bridge
